version: '3.8'

services:
  pyrotrack:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pyrotrack_app
    ports:
      - "8088:8000"
    volumes:
      # We only map the backend folder so your SQLite database persists locally.
      # The React static files are safely isolated in /frontend_build inside the container!
      - ./backend:/app
    restart: unless-stopped
